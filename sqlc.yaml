version: "2"
sql:
  - schema: "migrations/sqlite"
    queries: "internal/storage/sqlite/queries.sql"
    engine: "sqlite" # или postgresql
    gen:
      go:
        package: "sqlc"
        out: "internal/storage/sqlite/sqlc"
        emit_interface: true
        emit_json_tags: true
        overrides:
          - column: "*.id"
            go_type: "github.com/google/uuid.UUID"
          - column: "*.created_at"
            go_type: "time.Time"
          - column: "*.updated_at"
            go_type: "database/sql.NullTime"
          - column: "*.deleted_at"
            go_type: "database/sql.NullTime"