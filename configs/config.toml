pprof_enabled = false

[log]
level = "info"

[grpc_server]
host = "0.0.0.0"
port = 50051

[connect_server]
host = "0.0.0.0"
port = 50052
read_header_timeout = "3s"

[rest_server]
host = "0.0.0.0"
port = 8080
read_header_timeout = "3s"

[pprof_server]
host = "0.0.0.0"
port = 6060
read_header_timeout = "3s"

# Секция для базы данных
[sqlite]
path = "expo.db"
max_open_conns = 25
max_idle_conns = 25
conn_max_lifetime = "5m"
connect_timeout = "5s"