version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: expo/gen/pb
plugins:
  - local: protoc-gen-go
    out: gen/pb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/pb
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/pb
    opt: paths=source_relative
inputs:
  - directory: api/proto