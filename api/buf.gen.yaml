# For details on buf.gen.yaml configuration, visit https://buf.build/docs/configuration/v2/buf-gen-yaml
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: expo/pkg/pb
plugins:
  - local: ../bin/protoc-gen-go
    out: ../pkg/pb
    opt: paths=source_relative
  - local: ../bin/protoc-gen-go-grpc
    out: ../pkg/pb
    opt: paths=source_relative
inputs:
  - directory: proto