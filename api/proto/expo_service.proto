syntax = "proto3";

package proto;

option go_package = "expoapp/pkg/api/pb";

message GetInfoV1Request {}

message GetInfoV1Response {
  message Version {
    string version = 1;
  }

  Version version = 1;
}

service ExpoService {
  rpc GetInfoV1(GetInfoV1Request) returns (GetInfoV1Response) {}
}

