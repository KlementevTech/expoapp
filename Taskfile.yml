# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  NAMESPACE: klementevtech
  SERVICE: expo

  IMAGE: '{{.NAMESPACE}}/{{.SERVICE}}'
  IMAGE_LATEST: '{{.IMAGE}}:latest'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo "dev"
  IMAGE_VERSIONED: '{{.IMAGE}}:{{.VERSION}}'

  SERVICE_DIR: '{{.ROOT_DIR}}'
  BIN_DIR: '{{.SERVICE_DIR}}/bin'
  CI_DEV_DIR: '{{.SERVICE_DIR}}/ci/dev'
  API_DIR: '{{.SERVICE_DIR}}/api'
  DOCKERFILE_PATH: '{{.SERVICE_DIR}}/ci/docker/Dockerfile'
  SERVICE_BIN_PATH: '{{.BIN_DIR}}/{{.SERVICE}}'

  ALPINE_VERSION: '3.23'
  GOLANGCI_LINT_VERSION: 'v2.9.0'
  GOFUMPT_VERSION: 'v0.9.2'
  BUF_VERSION: 'v1.65.0'
  NANCY_VERSION: 'v1.0.46'

tasks:
  lint:
    desc: Запускает линтер
    deps:
      - task: install-tools
        silent: true
    cmds:
      - '{{.BIN_DIR}}/golangci-lint run ./...'

  format:
    desc: Запускает форматтер
    deps:
      - task: install-tools
        silent: true
    cmds:
      - '{{.BIN_DIR}}/gofumpt -l -w .'

  gen-mocks:
    desc: Генерирует моки
    deps:
      - task: install-tools
        silent: true
    cmds:
      - PATH="{{.BIN_DIR}}:$PATH" go generate ./...

  gen-pb:
    desc: Генерирует protobuf файлы используя Buf
    deps:
      - task: install-tools
        silent: true
    dir: "{{.API_DIR}}"
    cmds:
      - '{{.BIN_DIR}}/buf generate'

  lint-proto:
    desc: Проверка protobuf линтером
    deps:
      - task: install-tools
        silent: true
    dir: "{{.API_DIR}}"
    cmds:
      - '{{.BIN_DIR}}/buf lint'

  lint-proto-changes:
    desc: Проверка обратной совместимости proto файлов
    deps:
      - task: install-tools
        silent: true
    dir: "{{.API_DIR}}"
    cmds:
      - '{{.BIN_DIR}}/buf breaking --against "{{.SERVICE_DIR}}/.git#branch=main"'

  test:
    desc: Запускает тесты
    cmds:
      - go test -v ./...

  tidy:
    desc: Обновляет go.mod и go.sum
    cmds:
      - go mod tidy

  check-deps:
    desc: Проверяет наличие уязвимостей в зависимостях
    deps:
      - task: install-tools
        silent: true
    cmds:
      - |
        if [ -z "$NANCY_USERNAME" ] || [ -z "$NANCY_TOKEN" ]; then
          echo "[WARN] NANCY_USERNAME или NANCY_TOKEN не установлены"
          echo "   Проверка уязвимостей пропущена"
          echo "   Получите токен на https://ossindex.sonatype.org/"
          exit 0
        fi
        go list -json -deps ./... | {{.BIN_DIR}}/nancy sleuth

  pre-commit:
    desc: Запускает все проверки перед коммитом
    cmds:
      - task: format
      - task: lint
      - task: lint-proto
      - task: test
      - task: tidy
      - task: check-deps
      - echo "[OK] Все проверки пройдены"

  build-bin:
    desc: Собирает исполняемый файл
    deps:
      - mk-bin
    cmds:
      - |
        CGO_ENABLED=0 GOOS=linux \
        go build \
          -ldflags="-X main.version={{.VERSION}} -s -w" \
          -o "{{.SERVICE_BIN_PATH}}" \
          ./cmd/server

  build:
    desc: Собирает Docker образ
    deps:
      - build-bin
    cmds:
      - |
        docker build \
          --build-arg ALPINE_VERSION={{.ALPINE_VERSION}} \
          -t "{{.IMAGE_VERSIONED}}" \
          -t "{{.IMAGE_LATEST}}" \
          -f "{{.DOCKERFILE_PATH}}" .

  cp-env:
    desc: Копирует файл с переменными окружения
    dir: "{{.CI_DEV_DIR}}"
    status:
      - test -f .env
    cmds:
      - cp -n .env.example .env
      - echo "[OK] Файл .env создан из .env.example"

  up:
    desc: Поднимает сервис в docker контейнере
    dir: "{{.CI_DEV_DIR}}"
    env:
      EXPO_IMAGE: "{{.EXPO_IMAGE | default .IMAGE_VERSIONED}}"
    deps:
      - cp-env
    cmds:
      - docker compose up -d

  stop:
    desc: Останавливает сервис в docker контейнере
    dir: "{{.CI_DEV_DIR}}"
    cmds:
      - docker compose stop

  perf:
    desc: Запускает нагрузочный тест
    dir: "{{.CI_DEV_DIR}}"
    env:
      EXPO_IMAGE: "{{.EXPO_IMAGE | default .IMAGE_VERSIONED}}"
    cmds:
      - docker compose run --rm perf-test run "/scripts/test.js"
      - task: stop

  install-tools:
    desc: Устанавливает расширения для локальной разработки
    deps:
      - task: mk-bin
        silent: true
    status:
      - test -f "{{.BIN_DIR}}/golangci-lint"
      - test -f "{{.BIN_DIR}}/gofumpt"
      - test -f "{{.BIN_DIR}}/mockgen"
      - test -f "{{.BIN_DIR}}/protoc-gen-go"
      - test -f "{{.BIN_DIR}}/protoc-gen-go-grpc"
      - test -f "{{.BIN_DIR}}/buf"
      - test -f "{{.BIN_DIR}}/nancy"
    env:
      GOBIN: "{{.BIN_DIR}}"
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "{{.BIN_DIR}}" {{.GOLANGCI_LINT_VERSION}}
      - |
        go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}} &
        go install go.uber.org/mock/mockgen@latest &
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest &
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest &
        go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} &
        go install github.com/sonatype-nexus-community/nancy@{{.NANCY_VERSION}} &
        wait

  update-tools:
    desc: Обновляет все инструменты до последних версий
    cmds:
      - |
        rm -f {{.BIN_DIR}}/golangci-lint &
        rm -f {{.BIN_DIR}}/gofumpt & 
        rm -f {{.BIN_DIR}}/mockgen &
        rm -f {{.BIN_DIR}}/protoc-gen-go &
        rm -f {{.BIN_DIR}}/protoc-gen-go-grpc &
        rm -f {{.BIN_DIR}}/buf & 
        rm -f {{.BIN_DIR}}/nancy &
        wait
      - task: install-tools

  install-grpcurl:
    desc: Устанавливает gRPC CLI клиент
    status:
      - test -f "{{.BIN_DIR}}/grpcurl"
    env:
      GOBIN: "{{.BIN_DIR}}"
    cmds:
      - go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

  mk-bin:
    desc: Создает папку для бинарников
    status:
      - test -d "{{.BIN_DIR}}"
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - echo "[OK] Директория {{.BIN_DIR}} создана"

  clean:
    desc: Очищает все сгенерированные бинарники
    status:
      - test ! -d "{{.BIN_DIR}}"
    cmds:
      - rm -rf "{{.BIN_DIR}}"

  default:
    desc: Список доступных команд
    silent: true
    cmds:
      - task --list