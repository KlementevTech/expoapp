# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  NAMESPACE: klementevtech
  SERVICE: expo
  TAG:
    sh: git describe --tags --always --dirty 2>/dev/null | sed 's/^v//' || echo "dev"

  IMAGE: '{{.NAMESPACE}}/{{.SERVICE}}'
  IMAGE_LATEST: '{{.IMAGE}}:latest'
  IMAGE_TAGGED: '{{.IMAGE}}:{{.TAG}}'

  SERVICE_DIR: '{{.ROOT_DIR}}'
  DOCKERFILE: '{{.ROOT_DIR}}/docker/Dockerfile'
  BIN_DIR: '{{.SERVICE_DIR}}/bin'
  API_DIR: '{{.SERVICE_DIR}}/api'

  GOLANGCI_LINT_VERSION: 'v2.10.1'
  GOFUMPT_VERSION: 'v0.9.2'
  BUF_VERSION: 'v1.66.0'
  NANCY_VERSION: 'v1.2.0'
  OAPI_CODEGEN_VERSION: 'v2.5.1'

tasks:
  lint:
    desc: Запускает линтер
    deps:
      - task: install-tools
        silent: true
    cmds:
      - '{{.BIN_DIR}}/golangci-lint run ./...'

  fix:
    desc: Запускает фиксер линтера
    deps:
      - task: install-tools
        silent: true
    cmds:
      - '{{.BIN_DIR}}/golangci-lint run --fix ./...'

  format:
    desc: Запускает форматтер
    deps:
      - task: install-tools
        silent: true
    cmds:
      - '{{.BIN_DIR}}/gofumpt -l -w .'

  gen-mocks:
    desc: Генерирует моки
    deps:
      - task: install-tools
        silent: true
    cmds:
      - PATH="{{.BIN_DIR}}:$PATH" go generate ./...

  gen-pb:
    desc: Генерирует protobuf файлы используя Buf
    deps:
      - task: install-tools
        silent: true
    dir: '{{.SERVICE_DIR}}'
    cmds:
      - '{{.BIN_DIR}}/buf generate'

  gen-oapi:
    desc: Генерирует OpenApi файлы используя oapi-codegen
    cmds:
      - '{{.BIN_DIR}}/oapi-codegen --config codegen.cfg.yaml api/openapi/openapi.yml'

  lint-proto:
    desc: Проверка protobuf линтером
    deps:
      - task: install-tools
        silent: true
    dir: '{{.API_DIR}}'
    cmds:
      - '{{.BIN_DIR}}/buf lint'

  lint-proto-changes:
    desc: Проверка обратной совместимости proto файлов
    deps:
      - task: install-tools
        silent: true
    dir: '{{.API_DIR}}'
    cmds:
      - '{{.BIN_DIR}}/buf breaking --against "{{.SERVICE_DIR}}/.git#branch=main"'

  test:
    desc: Запускает тесты
    cmds:
      - go test -v ./...

  tidy:
    desc: Обновляет go.mod и go.sum
    cmds:
      - go mod tidy

  check-deps:
    desc: Проверяет наличие уязвимостей в зависимостях
    deps:
      - task: install-tools
        silent: true
    cmds:
      - |
        if [ -z "$NANCY_USERNAME" ] || [ -z "$NANCY_TOKEN" ]; then
          echo "[WARN] NANCY_USERNAME или NANCY_TOKEN не установлены"
          echo "   Проверка уязвимостей пропущена"
          echo "   Получите токен на https://ossindex.sonatype.org/"
          exit 0
        fi
        go list -json -deps ./... | {{.BIN_DIR}}/nancy sleuth

  pre-commit:
    desc: Запускает все проверки перед коммитом
    cmds:
      - task: format
      - task: fix
      - task: lint
      - task: lint-proto
      - task: test
      - task: tidy
      - echo "[OK] Все проверки пройдены"

  cp-env:
    desc: Копирует файл с переменными окружения
    silent: true
    status:
      - test -f .env
    cmds:
      - |
        cp --update=none .env.example .env
      - echo "[OK] Файл .env создан из .env.example"

  docker-build:
    desc: Сборка Docker образа, мультистейдж
    cmds:
      - |
        docker build \
          -f "{{.DOCKERFILE}}" \
          --build-arg VERSION={{.TAG}} \
          -t "{{.IMAGE_TAGGED}}" \
          -t "{{.IMAGE_LATEST}}" \
          .

  compose-up:
    desc: Поднимает сервис в docker контейнере
    env:
      EXPO_PORT: '{{.EXPO_PORT | default "50051"}}'
      EXPO_TAG: '{{.EXPO_TAG | default "latest"}}'
    cmds:
      - docker compose up -d

  compose-stop:
    desc: Останавливает сервис в docker контейнере
    cmds:
      - docker compose stop

  compose-logs:
    desc: Показывает логи сервиса
    cmds:
      - docker compose logs -f

  test-perf:
    desc: Запускает нагрузочный тест
    env:
      EXPO_PORT: '{{.EXPO_PORT | default "50051"}}'
    cmds:
      - docker compose run --rm expo-k6 run "/scripts/test.js"
      - task: compose-stop

  install-tools:
    desc: Устанавливает расширения для локальной разработки
    status:
      - test -f "{{.BIN_DIR}}/golangci-lint"
      - test -f "{{.BIN_DIR}}/gofumpt"
      - test -f "{{.BIN_DIR}}/mockgen"
      - test -f "{{.BIN_DIR}}/protoc-gen-go"
      - test -f "{{.BIN_DIR}}/protoc-gen-go-grpc"
      - test -f "{{.BIN_DIR}}/buf"
      - test -f "{{.BIN_DIR}}/nancy"
      - test -f "{{.BIN_DIR}}/oapi-codegen"
    env:
      GOBIN: '{{.BIN_DIR}}'
    cmds:
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "{{.BIN_DIR}}" {{.GOLANGCI_LINT_VERSION}}
      - |
        go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}} &
        go install go.uber.org/mock/mockgen@latest &
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest &
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest &
        go install github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} &
        go install github.com/sonatype-nexus-community/nancy@{{.NANCY_VERSION}} &
        go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}} &
        wait

  update-tools:
    desc: Обновляет все инструменты до последних версий
    cmds:
      - |
        rm -f {{.BIN_DIR}}/golangci-lint &
        rm -f {{.BIN_DIR}}/gofumpt & 
        rm -f {{.BIN_DIR}}/mockgen &
        rm -f {{.BIN_DIR}}/protoc-gen-go &
        rm -f {{.BIN_DIR}}/protoc-gen-go-grpc &
        rm -f {{.BIN_DIR}}/buf & 
        rm -f {{.BIN_DIR}}/nancy &
        wait
      - task: install-tools

  install-grpcurl:
    desc: Устанавливает gRPC CLI клиент
    status:
      - test -f "{{.GOBIN}}/grpcurl"
    cmds:
      - go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest

  default:
    desc: Список доступных команд
    silent: true
    cmds:
      - task --list